            const openClueAction = (clue) => {
                setSelectedClue(clue);
                if (!caseState.cluesViewed.includes(clue.id)) {
                    const newViewed = [...caseState.cluesViewed, clue.id];
                    updateGameState(prev => ({
                        cases: {
                            ...prev.cases,
                            [caseData.id]: { ...prev.cases[caseData.id], cluesViewed: newViewed }
                        }
                    }));
                }
            };

            const submitGuess = (selectedOption) => {
                const isCorrect = selectedOption === caseData.correctAnswer;
                
                if (isCorrect) {
                    let scoreEarned = 100;
                    if (viewedCount <= 3) scoreEarned += 50; // Bonus for early deduction
                    if (viewedCount === 5) scoreEarned += 20; // Bonus for thoroughness
                    
                    // Unlock next case logic
                    const casesKeys = Object.keys(gameState.cases);
                    const currentIndex = casesKeys.indexOf(caseData.id);
                    let nextCasesUpdate = {};
                    if (currentIndex < casesKeys.length - 1) {
                        const nextCaseId = casesKeys[currentIndex + 1];
                        nextCasesUpdate = {
                            [nextCaseId]: { ...gameState.cases[nextCaseId], status: 'unlocked' }
                        };
                    }

                    updateGameState(prev => ({
                        totalScore: prev.totalScore + scoreEarned,
                        cases: {
                            ...prev.cases,
                            [caseData.id]: { ...prev.cases[caseData.id], correct: true, answer: selectedOption, score: scoreEarned },
                            ...nextCasesUpdate
                        }
                    }));
                    setPhase('resolved');

                    setShowHintMsg("❌ 아직 단서가 부족하거나 추론이 어긋난 것 같습니다. 확인한 단서들을 다시 천천히 읽어보세요.");
                    setTimeout(() => setShowHintMsg(""), 4000);
                }
            };

            const handleNoteChange = (e) => {
                updateGameState(prev => ({
                    cases: {
                        ...prev.cases,
                        [caseData.id]: { ...prev.cases[caseData.id], detectiveNote: e.target.value }

                                    {caseData.mysteryTitle}
                                </h2>
                                <p className="mt-6 text-lg leading-relaxed text-stone-700 bg-stone-100 p-4 rounded border-l-4 border-folder">
                                    {caseData.desc}

                                {caseData.clues.map((clue, index) => {

                                    const isLocked = index > viewedCount;

                                        <div key={clue.id}

                                                relative border-2 transition-all duration-300

                                                  'border-ink bg-paper cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,0.2)]'}

                                            <div className="p-4 flex items-start gap-4">
                                                <div className="text-3xl bg-white p-2 rounded-full border border-stone-300 shadow-sm shrink-0">
                                                    {isLocked ? '🔒' : clue.icon}
                                                </div>
                                                <div className="flex-grow">
                                                    <div className="text-xs font-bold text-stone-500 mb-1">
                                                        CLUE 0{index + 1} {clue.isDecisive && <span className="text-red-500 ml-2">⚠️ 결정적 단서</span>}
                                                    </div>
                                                    <h4 className="text-xl font-bold font-serif text-ink">
                                                        {isLocked ? '접근 불가' : clue.title}

                                                                </div>

                                                                {clue.content}

                                                                💡 탐정의 질문: {clue.question}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );

                            </div>

                                    </button>
                                </div>
                            )}

                    <div className="w-full md:w-1/3 bg-paper p-6 flex flex-col shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.1)] z-10 custom-scrollbar overflow-y-auto">

                                                {caseData.humanRightsFeedback}
                                            </div>

                                                {caseData.humanRightsOpts.map((opt, i) => (
                                                    <button key={i} 
                                                        className="text-xs bg-white border border-stone-300 px-2 py-1 rounded hover:bg-stone-100"
                                                        onClick={() => {
                                                            updateGameState(prev => ({ cases: { ...prev.cases, [caseData.id]: { ...prev.cases[caseData.id], hrAnswered: true } } }));
                                                        }}
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <button onClick={onBack} className="mt-4 bg-ink text-paper py-3 rounded font-bold w-full hover:bg-stone-800 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.3)]">
                                        보관함으로 돌아가기
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 인앱 커스텀 모달 컴포넌트 */}
                    {customModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-paper p-6 rounded border-2 border-ink max-w-md w-full shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] text-center animate-fade-in-up">
                                <h3 className="text-2xl font-bold font-serif mb-3">{customModal.title}</h3>
                                <p className="text-stone-800 mb-6 font-serif text-lg leading-relaxed">{customModal.message}</p>
                                <div className="flex gap-3 justify-center">
                                    {customModal.onCancel && (
                                        <button onClick={customModal.onCancel} className="px-5 py-2.5 border-2 border-ink rounded bg-stone-200 font-bold hover:bg-stone-300">
                                            취소
                                        </button>
                                    )}
                                    <button onClick={customModal.onConfirm} className="px-6 py-2.5 bg-ink text-paper rounded font-bold hover:bg-stone-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                        확인
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const FinalCase = ({ gameState, onComplete }) => {
            const [step, setStep] = React.useState(0);
            const [selectedCards, setSelectedCards] = React.useState([]);

            const synthesisWords = [

                    <div className="max-w-3xl w-full z-10 flex flex-col items-center text-center">

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
