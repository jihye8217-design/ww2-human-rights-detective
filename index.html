  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [caseSolved, setCaseSolved] = useState(false);
  const [attemptCount, setAttemptCount] = useState(0);
  const [caseFeedback, setCaseFeedback] = useState('');

  // 타임라인 상태
  const [timelineOrder, setTimelineOrder] = useState([]);
  const [draggedItemIndex, setDraggedItemIndex] = useState(null);
  const [timelineSubmitted, setTimelineSubmitted] = useState(false);
  const [timelineFeedback, setTimelineFeedback] = useState(null);

  // 최종 보고서 상태
  const [finalReportText, setFinalReportText] = useState('');

  // 로컬스토리지 불러오기
  useEffect(() => {
    const saved = localStorage.getItem('history_detective_data');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (data.nickname) setNickname(data.nickname);
        if (data.score !== undefined) setScore(data.score);
        if (data.unlockedCases) setUnlockedCases(data.unlockedCases);
        if (data.solvedCases) setSolvedCases(data.solvedCases);
        if (data.cluesCollected) setCluesCollected(data.cluesCollected);
        if (data.finalReportText) setFinalReportText(data.finalReportText);
      } catch(e) { console.error(e); }
    }
    resetTimelineCards();
  }, []);

  // 상태 변경 시 저장
  useEffect(() => {
    const data = { nickname, score, unlockedCases, solvedCases, cluesCollected, finalReportText };
    localStorage.setItem('history_detective_data', JSON.stringify(data));
  }, [nickname, score, unlockedCases, solvedCases, cluesCollected, finalReportText]);

  const resetTimelineCards = () => {
    const shuffled = [...INITIAL_TIMELINE_CARDS].sort(() => Math.random() - 0.5);
    setTimelineOrder(shuffled);
  };

  const getRank = (sc) => {
    if (sc >= 600) return { title: "🏆 역사 사건 해결사", color: "text-amber-400" };
    if (sc >= 400) return { title: "🕵️ 전문 역사 탐정", color: "text-yellow-400" };
    if (sc >= 200) return { title: "📚 역사 탐정", color: "text-blue-400" };
    return { title: "🔎 견습 탐정", color: "text-gray-300" };
  };

  const handleSelectCase = (index) => {
    if (index + 1 > unlockedCases) {
      alert("🔒 이전 사건을 먼저 해결해야 접근할 수 있습니다!");
      return;
    }
    setCurrentCaseIdx(index);
    setEvidenceStep(0);
    setSelectedAnswer(null);
    setCaseSolved(solvedCases[index]);
    setAttemptCount(0);
    setCaseFeedback('');
    setScreen('case_detail');
  };

  const handleCollectClue = (clueText, isQuestionOption = false) => {
    if (!clueText) return;
    if (!cluesCollected.includes(clueText)) {
      setCluesCollected(prev => [...prev, clueText]);
      setScore(s => s + 10);
    }
  };

  // 💡 [버그 수정 완료] 함수명 일치 - handleSubmitCaseAnswer
  const handleSubmitCaseAnswer = () => {
    const currentCase = CASES_DATA[currentCaseIdx];
    if (selectedAnswer === null) {
      alert("추리 정답을 선택해주세요!");
      return;
    }

    const newAttempts = attemptCount + 1;
    setAttemptCount(newAttempts);

    if (selectedAnswer === currentCase.answerIndex) {
      let earnedPoints = 50;
      if (newAttempts === 2) earnedPoints = 30;
      if (newAttempts >= 3) earnedPoints = 20;

      if (!solvedCases[currentCaseIdx]) {
        const nextSolved = [...solvedCases];
        nextSolved[currentCaseIdx] = true;
        setSolvedCases(nextSolved);
        
        let bonus = 0;
        if (nextSolved.every(v => v === true)) {
          bonus += 100;
        }
        setScore(s => s + earnedPoints + bonus);
        
        if (unlockedCases < currentCaseIdx + 2) {
          setUnlockedCases(currentCaseIdx + 2);
        }
      }
      setCaseSolved(true);
      setCaseFeedback("success");
    } else {
      setCaseFeedback("wrong");
    }
  };

  const handleNextStepFromCase = () => {
    if (currentCaseIdx < 5) {
      handleSelectCase(currentCaseIdx + 1);
    } else {
      resetTimelineCards();
      setTimelineSubmitted(false);
      setTimelineFeedback(null);
      setScreen('timeline');
    }
  };

  // 드래그 앤 드롭
  const handleDragStart = (e, index) => {
    setDraggedItemIndex(index);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", index); // Firefox 호환성 추가
  };

  const handleDragOver = (e, index) => {
    e.preventDefault();
  };

  const handleDrop = (e, targetIndex) => {
    e.preventDefault();
    if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;

    const updated = [...timelineOrder];
    const [draggedItem] = updated.splice(draggedItemIndex, 1);
    updated.splice(targetIndex, 0, draggedItem);

    setDraggedItemIndex(null);
    setTimelineOrder(updated);
  };

  const handleCheckTimeline = () => {
    const userOrderIDs = timelineOrder.map(c => c.id);
    let correctCount = 0;
    for (let i = 0; i < 6; i++) {
      if (userOrderIDs[i] === CORRECT_TIMELINE_ORDER[i]) correctCount++;
    }

    let points = 20;
    let title = "";
    if (correctCount === 6) { points = 100; title = "🏆 완벽한 복원!"; }
    else if (correctCount === 5) { points = 80; title = "🌟 거의 완벽합니다!"; }
    else if (correctCount === 4) { points = 60; title = "👍 좋은 추리입니다!"; }
    else if (correctCount === 3) { points = 40; title = "🔎 조금 더 단서를 확인해보세요!"; }
    else { points = 20; title = "📓 탐정 수첩을 다시 확인해보세요!"; }

    if (!timelineSubmitted) {
      setScore(s => s + points);
    }

    setTimelineSubmitted(true);
    setTimelineFeedback({ count: correctCount, points: points, title: title });
  };

  const handleSubmitReport = (e) => {
    e.preventDefault();
    if (finalReportText.trim().length < 30) {
      alert("탐정으로서의 생각을 최소 30자 이상 작성해주세요!");
      return;
    }
    setScreen('result');
  };

  const handleResetApp = () => {
    if (confirm("모든 진도와 점수를 초기화하고 처음부터 다시 시작하시겠습니까?")) {
      localStorage.removeItem('history_detective_data');
      setNickname('');
      setScore(0);
      setUnlockedCases(1);
      setSolvedCases([false, false, false, false, false, false]);
      setCluesCollected([]);
      setFinalReportText('');
      setScreen('home');
    }
  };

  // ==========================================
  // 3. 뷰 렌더링
  // ==========================================
  return (
    <div className="max-w-4xl mx-auto px-4 py-6 min-h-screen flex flex-col justify-between">
      {screen !== 'home' && screen !== 'nickname' && screen !== 'teacher_mode' && (
        <header className="detective-card p-4 rounded-xl mb-6 flex items-center justify-between border-b-2 border-amber-600">
          <button 
            onClick={() => setShowNotebook(true)}
            className="flex items-center gap-2 bg-amber-950 hover:bg-amber-900 text-amber-200 px-3 py-2 rounded-lg text-sm md:text-base border border-amber-700 transition"
          >
            <i className="fa-solid fa-book-bookmark text-amber-400"></i>
            <span>📓 탐정 수첩 ({cluesCollected.length})</span>
          </button>
          
          <div className="font-bold text-amber-100 text-sm md:text-lg">
            {screen === 'case_detail' && `${CASES_DATA[currentCaseIdx].code} / 06`}
            {screen === 'timeline' && "🔥 FINAL MISSION"}
            {screen === 'final_report' && "🧠 사건 보고서"}
            {screen === 'result' && "🏆 사건 수사 완료"}
          </div>

          <div className="flex items-center gap-3">
            <div className="bg-amber-500/20 text-amber-300 font-bold px-3 py-1.5 rounded-full border border-amber-500/40 text-sm md:text-base">
              ⭐ {score}점
            </div>
            <button 
              onClick={() => setScreen('case_list')} 
              className="text-gray-400 hover:text-white text-sm underline"
            >
              목록
            </button>
          </div>
        </header>
      )}

      {/* --- 화면: HOME --- */}
      {screen === 'home' && (
        <div className="detective-card p-8 md:p-12 rounded-2xl text-center my-auto flex flex-col items-center border border-amber-800/40 shadow-2xl">
          <div className="text-6xl mb-4 animate-bounce">🔎</div>
          <h2 className="text-xl md:text-2xl font-bold text-amber-500 mb-2">역사탐정</h2>
          <h1 className="text-3xl md:text-5xl font-extrabold text-amber-100 mb-6 tracking-tight">
            제2차 세계대전 사건파일
          </h1>
          <p className="text-amber-200/80 text-lg md:text-xl max-w-lg mb-8 leading-relaxed font-serif italic">
            "흩어진 단서를 모아<br/>제2차 세계대전의 진실을 밝혀라!"
          </p>
          <button 
            onClick={() => setScreen(nickname ? 'case_list' : 'nickname')}
            className="w-full max-w-xs bg-amber-600 hover:bg-amber-500 text-amber-950 font-extrabold text-xl py-4 px-8 rounded-xl shadow-lg transform transition hover:-translate-y-1"
          >
            [탐정 활동 시작]
          </button>
          
          <div className="mt-12 flex items-center gap-4 text-xs text-gray-400">
            <span>중학교 2학년 역사</span>
            <span>•</span>
            <button onClick={() => setScreen('teacher_mode')} className="hover:text-amber-400 underline">
              [교사용 모드]
            </button>
          </div>
        </div>
      )}

      {/* --- 화면: 닉네임 --- */}
      {screen === 'nickname' && (
        <div className="detective-card p-8 rounded-2xl text-center my-auto max-w-md mx-auto w-full">
          <div className="text-5xl mb-4">🕵️‍♂️</div>
          <h2 className="text-2xl font-bold text-amber-400 mb-2">탐정님의 이름을 알려주세요</h2>
          <p className="text-gray-400 text-sm mb-6">수사 보고서에 기록될 닉네임을 입력합니다.</p>
          
          <form onSubmit={(e) => {
            e.preventDefault();
            if(!nickname.trim()) { alert("닉네임을 입력해주세요!"); return; }
            setScreen('case_list');
          }}>
            <input 
              type="text" 
              placeholder="탐정 이름" 
              value={nickname}
              onChange={(e) => setNickname(e.target.value)}
              className="w-full bg-stone-900 border border-amber-700/60 rounded-xl px-4 py-3 text-center text-amber-100 text-lg focus:outline-none focus:border-amber-400 mb-6"
              autoFocus
            />
            <button 
              type="submit"
              className="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold text-lg py-3 rounded-xl transition"
            >
              [사건파일 열기]
            </button>
          </form>
        </div>
      )}

      {/* --- 화면: 사건 목록 --- */}
      {screen === 'case_list' && (
        <div className="space-y-6">
          <div className="flex items-center justify-between border-b border-stone-700 pb-4">
            <div>
              <h2 className="text-2xl font-bold text-amber-400 flex items-center gap-2">
                <span>📁 사건파일 목록</span>
              </h2>
              <p className="text-stone-400 text-sm">탐정: <span className="text-amber-200 font-bold">{nickname}</span>님</p>
            </div>
            <button 
              onClick={() => setScreen('teacher_mode')}
              className="text-xs text-stone-400 hover:text-amber-400 border border-stone-700 px-3 py-1.5 rounded-lg"
            >
              교사용 안내
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {CASES_DATA.map((c, idx) => {
              const isUnlocked = idx + 1 <= unlockedCases;
              const isSolved = solvedCases[idx];
              let statusBadge = <span className="text-stone-500 font-bold">🔒 잠김</span>;
              if (isSolved) statusBadge = <span className="text-emerald-400 font-bold">✅ 해결 완료</span>;
              else if (isUnlocked) statusBadge = <span className="text-amber-400 font-bold animate-pulse">🔎 조사 중</span>;

              return (
                <div 
                  key={c.id}
                  onClick={() => isUnlocked && handleSelectCase(idx)}
                  className={`detective-card p-5 rounded-xl border transition cursor-pointer relative overflow-hidden flex flex-col justify-between ${
                    isUnlocked ? 'border-amber-700/60 hover:border-amber-500 hover:scale-[1.01]' : 'opacity-50 border-stone-800 cursor-not-allowed'
                  }`}
                >
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-mono px-2 py-0.5 rounded bg-stone-800 text-amber-300 border border-amber-900/50">
                        {c.code}
                      </span>
                      {statusBadge}
                    </div>
                    <h3 className="text-lg font-bold text-stone-100 mb-1">{c.title}</h3>
                    <p className="text-xs text-stone-400 line-clamp-2">{c.subtitle}</p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-stone-800 flex justify-between items-center text-xs text-amber-500/80">
                    <span>{c.year}년 사건</span>
                    <span>{isUnlocked ? "사건 수사하기 →" : "이전 사건 해결 필요"}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {solvedCases.every(v => v === true) && (
            <div className="detective-card p-6 rounded-xl border border-amber-500 text-center bg-amber-950/40">
              <h3 className="text-xl font-bold text-amber-300 mb-2">🏆 모든 6개 사건파일 해결 완료!</h3>
              <p className="text-stone-300 text-sm mb-4">이제 역사의 시간선을 원래대로 복원할 마지막 미션에 도전하세요.</p>
              <button 
                onClick={() => { resetTimelineCards(); setScreen('timeline'); }}
                className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-extrabold px-6 py-3 rounded-xl text-lg shadow-lg"
              >
                🔥 FINAL MISSION : 타임라인 복원 시작
              </button>
            </div>
          )}
        </div>
      )}

      {/* --- 화면: 사건 수사(Case) --- */}
      {screen === 'case_detail' && (
        <div className="space-y-6">
          <div className="detective-card p-6 rounded-2xl border-l-4 border-amber-500">
            <div className="text-xs text-amber-400 font-mono mb-1">{CASES_DATA[currentCaseIdx].code}</div>
            <h2 className="text-2xl font-bold text-stone-100 mb-2">{CASES_DATA[currentCaseIdx].title}</h2>
            <p className="text-stone-300 text-sm leading-relaxed bg-stone-950/50 p-3 rounded-lg border border-stone-800">
              💬 <strong>사건 브리핑:</strong> {CASES_DATA[currentCaseIdx].briefing}
            </p>
          </div>

          <div className="space-y-4">
            <h3 className="text-lg font-bold text-amber-300">🔍 사건 자료 분석 및 단서 수집</h3>

            {CASES_DATA[currentCaseIdx].evidences.map((ev, eIdx) => {
              const isOpen = eIdx <= evidenceStep;
              return (
                <div key={ev.id} className="detective-card rounded-xl border border-stone-700/60 overflow-hidden">
                  <div 
                    onClick={() => {
                      if (eIdx === evidenceStep + 1) {
                        setEvidenceStep(eIdx);
                        setScore(s => s + 10);
                      }
                    }}
                    className={`p-4 flex justify-between items-center ${isOpen ? 'bg-stone-900/90' : 'bg-stone-950/40 cursor-pointer hover:bg-stone-900/50'}`}
                  >
                    <span className="font-bold text-stone-200">{ev.title}</span>
                    <span className="text-xs px-2 py-1 rounded bg-stone-800 text-stone-400">
                      {isOpen ? "분석 완료" : `자료 열기 (+10점)`}
                    </span>
                  </div>

                  {isOpen && (
                    <div className="p-5 border-t border-stone-800 space-y-3 bg-stone-900/30">
                      <p className="text-stone-300 text-sm leading-relaxed">{ev.content}</p>
                      
                      {ev.question && (
                        <div className="bg-amber-950/30 p-3 rounded-lg border border-amber-800/40 text-xs md:text-sm">
                          <p className="font-bold text-amber-200 mb-2">❓ {ev.question}</p>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                            {ev.options.map((opt, oIdx) => (
                              <button 
                                key={oIdx}
                                onClick={() => {
                                  if (oIdx === ev.correctIndex) {
                                    alert(`🎯 정확한 단서 발견! (+10점)\n[단서: ${ev.clue}]`);
                                    handleCollectClue(ev.clue, true);
                                  } else {
                                    alert("❌ 올바른 단서가 아닙니다. 다시 분석해보세요!");
                                  }
                                }}
                                className="text-left bg-stone-800 hover:bg-stone-700 p-2 rounded border border-stone-700 text-stone-200 text-xs"
                              >
                                {oIdx + 1}. {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {!ev.question && (
                        <div className="flex justify-end">
                          <button 
                            onClick={() => {
                              alert(`📌 탐정 수첩에 단서 수집 완료! (+10점)\n[단서: ${ev.clue}]`);
                              handleCollectClue(ev.clue);
                            }}
                            className="bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-bold px-3 py-1.5 rounded-md border border-amber-600"
                          >
                            단서 수집하기
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="detective-card p-6 rounded-2xl border-2 border-amber-600/60 space-y-4">
            <h3 className="text-xl font-bold text-amber-400">🧠 사건 추리 문제</h3>
            <p className="text-stone-200 font-medium text-base md:text-lg">
              "{CASES_DATA[currentCaseIdx].question}"
            </p>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
              {CASES_DATA[currentCaseIdx].options.map((opt, idx) => (
                <button
                  key={idx}
                  onClick={() => setSelectedAnswer(idx)}
                  className={`p-4 rounded-xl text-left border font-semibold transition flex items-center gap-3 ${
                    selectedAnswer === idx 
                      ? 'bg-amber-500 text-stone-950 border-amber-400 shadow-md scale-[1.01]'
                      : 'bg-stone-900 text-stone-200 border-stone-700 hover:border-amber-600'
                  }`}
                >
                  <span className="w-6 h-6 rounded-full bg-stone-800 text-amber-400 flex items-center justify-center text-xs font-bold border border-amber-900">
                    {idx + 1}
                  </span>
                  <span>{opt}</span>
                </button>
              ))}
            </div>

            {/* 💡 수정한 부분: handleSubmitCaseAnswer 호출 */}
            {!caseSolved && (
              <div className="pt-4 flex justify-end">
                <button
                  onClick={handleSubmitCaseAnswer}
                  className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-6 py-3 rounded-xl text-base shadow-lg transition"
                >
                  사건 추리 제출하기
                </button>
              </div>
            )}

            {caseFeedback === 'wrong' && (
              <div className="p-4 bg-red-950/60 border border-red-700 text-red-200 rounded-xl text-sm flex items-center justify-between">
                <span>❌ 오답입니다. 수첩의 단서를 다시 확인하고 재도전해보세요!</span>
                <span className="text-xs bg-red-900 px-2 py-1 rounded">재도전 가능</span>
              </div>
            )}

            {caseSolved && (
              <div className="p-6 bg-emerald-950/60 border-2 border-emerald-500 rounded-xl space-y-3">
                <div className="text-emerald-400 font-extrabold text-xl">🎉 사건 해결 성공!</div>
                <p className="text-stone-200 text-sm leading-relaxed">{CASES_DATA[currentCaseIdx].explanation}</p>
                <div className="pt-3 flex justify-end">
                  <button
                    onClick={handleNextStepFromCase}
                    className="bg-emerald-500 hover:bg-emerald-400 text-stone-950 font-extrabold px-6 py-2.5 rounded-xl transition"
                  >
                    {currentCaseIdx < 5 ? "다음 사건으로 →" : "최종 미션 도전하기 →"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* --- 화면: 미니게임 (타임라인) --- */}
      {screen === 'timeline' && (
        <div className="space-y-6">
          <div className="detective-card p-6 rounded-2xl border border-amber-500 text-center space-y-2">
            <span className="text-xs font-mono px-3 py-1 rounded bg-amber-950 text-amber-400 border border-amber-700">FINAL MISSION</span>
            <h2 className="text-2xl md:text-3xl font-extrabold text-amber-200">역사의 시간선을 복원하라!</h2>
            <p className="text-stone-300 text-sm max-w-lg mx-auto leading-relaxed">
              모든 사건의 단서를 모았습니다. 제2차 세계대전은 어떤 순서로 전개되었을까?<br/>카드를 드래그하여 순서대로 배열하세요.
            </p>
            <div className="text-amber-400 font-bold text-sm pt-2">
              1939년 [ 침공 ] ➔ ➔ ➔ 1945년 [ 종결 ]
            </div>
          </div>

          <div className="space-y-3">
            {timelineOrder.map((card, idx) => (
              <div
                key={card.id}
                draggable
                onDragStart={(e) => handleDragStart(e, idx)}
                onDragOver={(e) => handleDragOver(e, idx)}
                onDrop={(e) => handleDrop(e, idx)}
                className="detective-card p-4 rounded-xl border border-amber-800/60 hover:border-amber-400 cursor-grab active:cursor-grabbing flex items-center gap-4 transition bg-stone-900/80"
              >
                <span className="w-8 h-8 rounded-full bg-amber-950 text-amber-300 font-bold flex items-center justify-center text-sm border border-amber-700">
                  {idx + 1}
                </span>
                <span className="font-bold text-stone-100 text-base md:text-lg flex-1">{card.text}</span>
                <i className="fa-solid fa-grip-lines text-stone-500 text-xl"></i>
              </div>
            ))}
          </div>

          <div className="flex justify-between items-center pt-2">
            <button onClick={resetTimelineCards} className="text-stone-400 hover:text-amber-300 text-sm underline">
              🔄 카드 다시 섞기
            </button>
            <button onClick={handleCheckTimeline} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-extrabold px-8 py-3 rounded-xl text-lg shadow-lg">
              [최종 제출 및 채점]
            </button>
          </div>

          {timelineSubmitted && timelineFeedback && (
            <div className="detective-card p-6 rounded-2xl border-2 border-amber-500 space-y-4 bg-stone-900">
              <div className="flex justify-between items-center border-b border-stone-800 pb-3">
                <h3 className="text-xl font-bold text-amber-300">{timelineFeedback.title}</h3>
                <span className="text-lg font-bold text-amber-400">+{timelineFeedback.points}점 획득</span>
              </div>

              {timelineFeedback.count < 6 ? (
                <div className="space-y-3">
                  <div className="p-4 bg-amber-950/40 border border-amber-700 rounded-xl text-sm space-y-2">
                    <p className="font-bold text-amber-300">💡 힌트 (다시 생각해볼 단서):</p>
                    <ul className="list-disc list-inside text-stone-300 text-xs space-y-1">
                      <li>독일의 폴란드 침공은 1939년 전쟁의 시작입니다.</li>
                      <li>진주만 공격은 1941년에 일어났습니다.</li>
                      <li>스탈린그라드 전투의 승기는 1942~1943년에 잡혔습니다.</li>
                      <li>노르망디 상륙작전은 1944년에 일어났습니다.</li>
                    </ul>
                  </div>
                  <div className="flex justify-end">
                    <button onClick={() => setTimelineSubmitted(false)} className="bg-stone-800 hover:bg-stone-700 text-amber-200 font-bold px-4 py-2 rounded-lg text-sm border border-stone-600">
                      [다시 배열하기]
                    </button>
                  </div>
                </div>
              ) : (
                <div className="space-y-4 pt-2">
                  <p className="text-emerald-400 text-sm font-semibold">🎉 정확히 복원했습니다!</p>
                  
                  <div className="p-4 bg-stone-950 rounded-xl border border-stone-800 space-y-3 text-xs md:text-sm">
                    <div className="font-bold text-amber-400 text-center mb-2">📜 연도별 실제 역사 전개 순서</div>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-center">
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1939년</span>
                        <p className="text-stone-200">폴란드 침공</p>
                      </div>
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1940년</span>
                        <p className="text-stone-200">영국 본토 항공전</p>
                      </div>
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1941년</span>
                        <p className="text-stone-200">진주만 공격·미 참전</p>
                      </div>
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1942년</span>
                        <p className="text-stone-200">스탈린그라드 전투</p>
                      </div>
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1944년</span>
                        <p className="text-stone-200">노르망디 상륙작전</p>
                      </div>
                      <div className="p-2 bg-stone-900 rounded border border-amber-900">
                        <span className="text-amber-400 font-mono font-bold">1945년</span>
                        <p className="text-stone-200">세계대전 종결</p>
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end">
                    <button onClick={() => setScreen('final_report')} className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-extrabold px-6 py-3 rounded-xl text-base shadow-lg">
                      최종 사건 보고서 작성하기 →
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* --- 화면: 최종 보고서 --- */}
      {screen === 'final_report' && (
        <div className="detective-card p-6 md:p-8 rounded-2xl border-2 border-amber-600/80 space-y-6">
          <div>
            <span className="text-xs font-mono text-amber-400">FINAL STEP</span>
            <h2 className="text-2xl font-extrabold text-stone-100 mt-1">🧠 최종 사건 보고서</h2>
            <p className="text-stone-300 text-sm mt-2">전체 사건을 조사한 후, 자신만의 관점을 정립해봅시다.</p>
          </div>

          <form onSubmit={handleSubmitReport} className="space-y-4">
            <div className="bg-stone-950 p-4 rounded-xl border border-stone-800 space-y-2">
              <label className="font-bold text-amber-300 text-base md:text-lg block">
                "제2차 세계대전은 왜 세계적인 전쟁으로 확대되었을까?"
              </label>
              <textarea
                rows="6"
                value={finalReportText}
                onChange={(e) => setFinalReportText(e.target.value)}
                placeholder="탐정으로 활동하면서 알게 된 내용을 바탕으로 자신의 생각을 적어보세요. (최소 30자)"
                className="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-stone-100 text-sm focus:outline-none focus:border-amber-500"
              ></textarea>
              <div className="flex justify-between text-xs text-stone-500">
                <span>* 최소 30자 이상 작성</span>
                <span className={finalReportText.trim().length >= 30 ? "text-emerald-400" : "text-amber-500"}>
                  현재 {finalReportText.trim().length} 자
                </span>
              </div>
            </div>

            <div className="flex justify-end pt-2">
              <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-extrabold px-8 py-3 rounded-xl text-lg shadow-lg">
                [최종 보고서 제출]
              </button>
            </div>
          </form>
        </div>
      )}

      {/* --- 화면: 결과 페이지 --- */}
      {screen === 'result' && (
        <div className="detective-card p-8 rounded-2xl border-2 border-amber-500 text-center space-y-6 my-auto">
          <div className="text-6xl animate-bounce">🏆</div>
          <div>
            <h2 className="text-3xl font-extrabold text-amber-200 mb-1">사건 수사 완료!</h2>
            <p className="text-xl font-bold text-stone-100">
              <span className="text-amber-400 underline">{nickname}</span> 탐정님
            </p>
          </div>
          <div className="bg-stone-950/70 p-6 rounded-xl border border-stone-800 max-w-md mx-auto space-y-4">
            <div>
              <span className="text-xs text-stone-400 block mb-1">해결한 사건 목록</span>
              <div className="flex flex-wrap justify-center gap-2 text-xs font-bold">
                {solvedCases.map((s, idx) => (
                  <span key={idx} className={`px-2 py-1 rounded ${s ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' : 'bg-stone-800 text-stone-500'}`}>
                    CASE 0{idx+1} {s ? '✅' : '❌'}
                  </span>
                ))}
              </div>
            </div>
            <div className="border-t border-stone-800 pt-3">
              <span className="text-xs text-stone-400">최종 획득 점수</span>
              <div className="text-4xl font-extrabold text-amber-400 mt-1">{score} 점</div>
            </div>
            <div className="border-t border-stone-800 pt-3">
              <span className="text-xs text-stone-400 block mb-1">탐정 칭호 등급</span>
              <div className={`text-2xl font-extrabold ${getRank(score).color}`}>
                {getRank(score).title}
              </div>
            </div>
          </div>
          <div className="p-4 bg-amber-950/40 border border-amber-800/60 rounded-xl max-w-lg mx-auto">
            <p className="text-amber-200 font-serif italic">
              "역사는 사건을 외우는 것이 아니라<br/>사건과 사건 사이의 연결을 이해하는 것입니다."
            </p>
          </div>
          <div className="flex justify-center gap-4 pt-4">
            <button onClick={() => setScreen('case_list')} className="bg-stone-800 hover:bg-stone-700 text-stone-200 font-bold px-5 py-2.5 rounded-xl text-sm border border-stone-600">
              사건 목록 확인
            </button>
            <button onClick={handleResetApp} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-5 py-2.5 rounded-xl text-sm">
              처음부터 다시하기
            </button>
          </div>
        </div>
      )}

      {/* --- 화면: 교사용 모드 --- */}
      {screen === 'teacher_mode' && (
        <div className="detective-card p-6 rounded-2xl space-y-6">
          <div className="flex justify-between items-center border-b border-stone-700 pb-3">
            <h2 className="text-2xl font-bold text-amber-400">👩‍🏫 교사용 모드 및 정답 안내</h2>
            <button onClick={() => setScreen('home')} className="bg-stone-800 hover:bg-stone-700 text-stone-200 px-3 py-1.5 rounded-lg text-sm">
              홈으로 돌아가기
            </button>
          </div>
          <div className="space-y-4 text-sm text-stone-300">
            <div className="bg-stone-950 p-4 rounded-xl border border-stone-800">
              <h3 className="font-bold text-amber-300 text-base mb-2">📊 점수 산정 방식 안내</h3>
              <ul className="list-disc list-inside space-y-1 text-xs">
                <li>자료 확인: +10점 / 단서 발견: +10점</li>
                <li>사건 추리 정답: 1회차(+50점), 2회차(+30점), 3회차 이상(+20점)</li>
                <li>6개 사건 전원 해결 보너스: +100점</li>
                <li>최종 타임라인 드래그 앤 드롭: 최고 +100점 (정답 수 비례)</li>
              </ul>
            </div>
            <div className="space-y-3">
              <h3 className="font-bold text-amber-300 text-base">🔑 사건별 정답 및 핵심 해설</h3>
              {CASES_DATA.map((c) => (
                <div key={c.id} className="p-3 bg-stone-900 rounded-lg border border-stone-800 space-y-1">
                  <div className="font-bold text-amber-200">{c.code}: {c.title}</div>
                  <div className="text-xs text-emerald-400">정답: {c.answerIndex + 1}번 ({c.options[c.answerIndex]})</div>
                  <div className="text-xs text-stone-400">{c.explanation}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* --- 모달: 탐정 수첩 --- */}
      {showNotebook && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="detective-card p-6 rounded-2xl max-w-md w-full border-2 border-amber-600 max-h-[80vh] flex flex-col">
            <div className="flex justify-between items-center border-b border-amber-800/80 pb-3 mb-4">
              <h3 className="text-xl font-bold text-amber-300">📓 탐정 수첩 (수집된 단서)</h3>
              <button onClick={() => setShowNotebook(false)} className="text-stone-400 hover:text-amber-200 text-xl font-bold">&times;</button>
            </div>
            <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
              {cluesCollected.length === 0 ? (
                <p className="text-stone-500 text-center py-8 text-sm">수집된 단서가 없습니다.</p>
              ) : (
                cluesCollected.map((clue, idx) => (
                  <div key={idx} className="p-3 bg-stone-900 rounded-lg border border-amber-900/40 text-stone-200 text-sm flex items-start gap-2">
                    <span className="text-amber-400 font-bold">📌</span>
                    <span>{clue}</span>
                  </div>
                ))
              )}
            </div>
            <div className="pt-4 border-t border-stone-800 mt-4 text-right">
              <button onClick={() => setShowNotebook(false)} className="bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold px-4 py-2 rounded-lg text-sm">
                닫기
              </button>
            </div>
          </div>
        </div>
      )}

      <footer className="mt-8 text-center text-xs text-stone-600 border-t border-stone-900 pt-4">
        제2차 세계대전 역사탐정 웹앱 • 중학교 2학년 역사 수업용 반응형 학습 매체
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
